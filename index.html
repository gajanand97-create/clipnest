<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ClipNest</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f6f8;
      color: #222;
    }

    header {
      background: #111827;
      color: white;
      padding: 18px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 28px;
    }

    header p {
      margin-top: 6px;
      color: #cbd5e1;
      font-size: 14px;
    }

    .container {
      max-width: 700px;
      margin: 35px auto;
      padding: 0 18px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px 22px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .thumbnail {
      height: 220px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1f2937, #4b5563);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 48px;
      margin-bottom: 22px;
    }

    h2 {
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      line-height: 1.6;
      margin-bottom: 22px;
    }

    .watch-btn {
      display: inline-block;
      background: #111827;
      color: white;
      text-decoration: none;
      padding: 13px 28px;
      border-radius: 10px;
      font-weight: bold;
    }

    .watch-btn:hover {
      opacity: 0.85;
    }

    footer {
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
      padding: 25px;
    }
  </style>
</head>

<body>

  <header>
    <h1>ClipNest</h1>
    <p>Simple &amp; clean video sharing</p>
  </header>

  <main class="container">

    <div class="card">

      <div class="thumbnail">
        ▶
      </div>

      <h2>Featured Video</h2>

      <p class="description">
        Watch the video using the button below.
      </p>

      <!-- Replace the URL below with your actual TeraBox share link -->
      <a
        class="watch-btn"
        href="https://1024terabox.com/s/15z6tcFrQfTcunSy5tkEoeQ"
        target="_blank"
        rel="noopener noreferrer">
        ▶ Watch Video
      </a>

    </div>

  </main>

  <footer>
    © 2026 ClipNest. All rights reserved.
  </footer>

</body>
</html>
